name = "workbuddy2api-engine"
main = "dist/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ===========================================================================
# 这一个 Worker 承担两件事：
#   1. 承载 PoolDO（Pages 项目不能自带 Durable Object）
#   2. 跑定时作业（Pages 项目没有 Cron Triggers）
#
# 两者可以共存：一个 Worker 同时导出 DO 类与 scheduled()，同时声明
# [[migrations]] 与 [triggers] crons，Worker 原生支持，没有冲突。
#
# 部署：npm run deploy:engine
# 之后 Pages 项目用 script_name = "workbuddy2api-engine" 引用这里的 PoolDO。
# ===========================================================================

# 定时触发：
#   0 * * * *     整点作业（签到/旅行/活跃/保活/夜猫子/成长/余额），
#                 由代码按北京时间判断这一个小时该跑哪些
#   30 17 * * *   UTC 17:30 = 北京时间次日 01:30，低峰期归档请求日志
[triggers]
crons = ["0 * * * *", "30 17 * * *"]

# Durable Object 类靠 [[migrations]] 注册。Pages 项目的 wrangler.toml 反而不
# 允许该字段，这正是 PoolDO 必须独立部署的原因。
#
# 必须用 new_sqlite_classes，不能用 new_classes：
#   Cloudflare 自 2025 年起规定「新建 DO namespace 只能用 SQLite 存储后端」，
#   免费套餐更是从未支持过 KV 后端的 DO。用 new_classes 部署会直接报：
#     In order to use Durable Objects with a free plan, you must create a
#     namespace using a new_sqlite_classes migration. [code: 10097]
#
#   对代码没有影响：SQLite 后端完整实现 storage 的 KV API（get/put/delete/list/
#   setAlarm 全都一样用，底层存进隐藏的 SQLite 表），还额外白送 SQL API 与
#   时间点恢复（PITR）。src/durable/ 里全是标准 KV 用法，无需改动。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PoolDO"]

# ---------------------------------------------------------------------------
# 绑定
# ---------------------------------------------------------------------------

# 非敏感配置（PoolDO 通过 getConfig 读取；定时作业读它判断各开关与小时列表）
[[kv_namespaces]]
binding = "WB2A_CONFIG"
id = "REPLACE_WITH_CONFIG_KV_ID"

# 模型目录缓存（PoolDO 内部链路用到）
[[kv_namespaces]]
binding = "WB2A_CACHE"
id = "REPLACE_WITH_CACHE_KV_ID"

# 请求日志：定时归档时从 D1 读出
[[d1_databases]]
binding = "WB2A_DB"
database_name = "workbuddy2api"
database_id = "REPLACE_WITH_D1_ID"

# 请求 JSONL 归档导出
[[r2_buckets]]
binding = "WB2A_LOGS"
bucket_name = "workbuddy2api-logs"

# 本 Worker 对 PoolDO 的绑定。**不写 script_name** —— 类和绑定在同一个
# script 里，默认就指向自己。Pages 侧那份才需要写 script_name 做远程引用。
[[durable_objects.bindings]]
name = "POOL"
class_name = "PoolDO"

# ---------------------------------------------------------------------------
# Secret（敏感，不进仓库）：
#   npx wrangler secret put WB2A_API_KEY --config engine-worker/wrangler.toml
#   npx wrangler secret put WB2A_DEVICE_TOKEN --config engine-worker/wrangler.toml
# 注意：Secret 是按 Worker 独立存储的，Pages 项目设的那些不会自动带过来，
# 这里要单独设一遍（至少 WB2A_API_KEY）。
# ---------------------------------------------------------------------------
