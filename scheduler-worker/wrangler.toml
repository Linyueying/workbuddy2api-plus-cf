name = "workbuddy2api-scheduler"
main = "dist/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# 定时作业 Worker。Pages 项目没有 Cron Triggers，所以调度必须放在 Workers。
#
# 部署：npm run deploy:scheduler
# 之后无需任何外部 cron 服务，也无需手动 arm DO alarm（那两条退为兜底）。
# ---------------------------------------------------------------------------

# 整点作业（签到/旅行/活跃/保活/夜猫子/成长/余额），由代码按北京时间判断该跑哪些
# 每日日志归档：UTC 17:30 = 北京时间次日 01:30（低峰）
[triggers]
crons = ["0 * * * *", "30 17 * * *"]

# 账号池（远程引用独立部署的 pool worker）
[[durable_objects.bindings]]
name = "POOL"
class_name = "PoolDO"
script_name = "workbuddy2api-pool"

# 非敏感配置（判断各作业开关与小时列表）
[[kv_namespaces]]
binding = "WB2A_CONFIG"
id = "REPLACE_WITH_CONFIG_KV_ID"

# 请求日志：从 D1 读出、归档到 R2
[[d1_databases]]
binding = "WB2A_DB"
database_name = "workbuddy2api"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "WB2A_LOGS"
bucket_name = "workbuddy2api-logs"

# ---------------------------------------------------------------------------
# 注意：本 Worker 不需要 WB2A_API_KEY —— 它直接调用内部函数，不走 HTTP 鉴权。
# 但需要一个 WB2A_CACHE 之外的东西吗？prompt.ts 的降级门会读 WB2A_CACHE，
# 若写作业链路间接用到就得绑。当前 runScheduledJobs 链路未用到，先不绑；
# 若日志出现 "WB2A_CACHE 不可读"，在此补一个即可。
#
# Secret 按 Worker 独立存储，本 Worker 无需任何 Secret。
# ---------------------------------------------------------------------------
