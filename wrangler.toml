# ============================================================================
# wrangler.toml —— 仅供本地 wrangler CLI 参考，不是 Pages 的生产配置
# ============================================================================
#
# ⚠️ 这里刻意**不写** pages_build_output_dir，也**不写**任何绑定。
#
# 原因：Cloudflare 的规则是——Pages 项目一旦有 wrangler.toml 且被识别为生产
# 配置，Dashboard 里对应的字段就变成**只读、点不动**，绑定只能靠改文件填 ID
# （这正是同类项目 K-Vault-Next 在它的 wrangler.toml 里写的：
#   「KV/R2 → Pages 后台绑定，本文件写不了 Pages 的 binding」）。
#
# 所以本项目走「零配置部署」：
#   构建输出目录、兼容标志、KV / D1 / R2 / Durable Object 绑定
#   ——全部在 Cloudflare Dashboard 的 Pages 项目设置里配，一个文件都不用改。
#   详见 DEPLOY-WEB.md。
#
# 本文件剩下的作用只有两个：
#   1. 本地 `npm run dev` 时 wrangler 会读它拿 compatibility_flags
#   2. 需要跑 D1 迁移等 CLI 命令时作为上下文
#   本地缺失的绑定一律用命令行参数现场传（见 package.json 的 dev 脚本）。
# ============================================================================

name = "workbuddy2api-pages"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# 以下是「如果哪天你想改成用配置文件管理绑定」时才需要的内容。
# 取消注释并把 REPLACE_WITH_* 换成真实 ID 即可；也可以不改文件，用：
#   npm run fill:ids     # 从环境变量注入，见 scripts/fill-ids.mjs
#
# 注意：一旦启用这些段，它们就会成为 Pages 的生产配置真源，
# Dashboard 里对应的绑定会变成只读——那就回退到「改文件」的老路了。
#
# [[kv_namespaces]]
# binding = "WB2A_CONFIG"   # 非敏感配置（config.json 导入后整体）
# id = "REPLACE_WITH_CONFIG_KV_ID"
#
# [[kv_namespaces]]
# binding = "WB2A_CACHE"    # 模型目录缓存 / model.json / output_probes
# id = "REPLACE_WITH_CACHE_KV_ID"
#
# [[d1_databases]]
# binding = "WB2A_DB"       # 用量记录、请求日志、子密钥库
# database_name = "workbuddy2api"
# database_id = "REPLACE_WITH_D1_ID"
#
# [[r2_buckets]]
# binding = "WB2A_LOGS"     # 请求 JSONL 归档导出
# bucket_name = "workbuddy2api-logs"
#
# [[durable_objects.bindings]]
# name = "POOL"
# class_name = "PoolDO"
# script_name = "workbuddy2api-pool"
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Pages 项目有两个硬性限制，决定了另外两个 Worker 必须独立存在：
#
# 1. 不能自带 Durable Object。DO 类必须靠 [[migrations]] 注册，而 Pages 的
#    wrangler.toml 不支持该字段（写了构建直接报错）。所以 PoolDO 单独部署为
#    Worker `workbuddy2api-pool`（见 pool-worker/），Pages 只做远程引用。
# 2. 没有 Cron Triggers。定时任务（签到/旅行/活跃/保活/夜猫子/成长/余额）
#    由独立的 `workbuddy2api-scheduler` Worker 用原生 cron 触发（见
#    scheduler-worker/），不再依赖外部 cron 服务或 DO alarm 自调度。
# ---------------------------------------------------------------------------
